name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: Build, lint, test, smoke
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Build
        run: cargo build --release

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Unit tests
        run: cargo test

      - name: Smoke test (end-to-end against Redis service)
        run: |
          cargo run --release -- \
            --url redis://127.0.0.1:6379/0 \
            --workers 2 \
            --jobs 500 \
            --timeout 60 \
            --output - \
            --quiet \
            --tag smoke \
          | tee /tmp/smoke.json
          # Verify the run completed all jobs without timing out
          jq -e '
            .results[0].total_jobs == 500 and
            .results[0].timed_out == false and
            .results[0].latency_us.total_count == 500
          ' /tmp/smoke.json
