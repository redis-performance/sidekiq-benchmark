name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            # Free GitHub-hosted ARM runner for public repos — native build,
            # no cross/QEMU needed (unlike docker.yml, which does need QEMU
            # because a single `docker buildx` invocation targets both
            # platforms from one runner).
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}

    steps:
      # submodules: recursive is required — sidekiq-rs (the Sidekiq worker
      # engine crate) is a git submodule and the build fails immediately
      # without it.
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # rustls pulls in `ring`, which compiles C and assembly, so the musl target needs a musl
      # C toolchain even though the rest of the tree is pure Rust.
      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      # A successful build says nothing about where the artifact can RUN. The previous -gnu
      # releases were built on ubuntu-24.04 and silently required GLIBC_2.39, so they could not
      # execute on Ubuntu 22.04 (2.35), Debian 12 (2.36) or RHEL 9 (2.34) -- and the failure mode
      # was a loader error at first use, not a build error. Assert the floor is gone.
      - name: Assert no glibc dependency
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/sidekiq-bench"
          if objdump -T "$BIN" 2>/dev/null | grep -qE 'GLIBC_[0-9]+\.[0-9]+'; then
            MAX=$(objdump -T "$BIN" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -uV | tail -1)
            echo "::error::artifact still links against glibc (max $MAX); it will not run on older hosts"
            exit 1
          fi
          file "$BIN"
          echo "OK: statically linked, no glibc version floor"

      - name: Package tarball + checksum
        run: |
          set -euo pipefail
          name="sidekiq-bench-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/sidekiq-bench" "dist/$name/"
          cp LICENSE README.md "dist/$name/"
          tar -C dist -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            sidekiq-bench-${{ matrix.target }}.tar.gz
            sidekiq-bench-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            artifacts/*
