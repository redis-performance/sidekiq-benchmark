[package]
name = "sidekiq-bench"
version = "0.1.2"
edition = "2021"

[[bin]]
name = "sidekiq-bench"
path = "src/main.rs"

[dependencies]
# Sidekiq worker + processor — our fork with processes-set cleanup on shutdown
# https://github.com/redis-performance/sidekiq-rs (branch: fix/process-deregister-on-shutdown)
rusty-sidekiq = { path = "sidekiq-rs" }

# bb8 connection pool — required by rusty-sidekiq Processor::new
bb8 = "0.9"

# async fn in trait (needed for #[async_trait] in worker.rs)
async-trait = "0.1"

# Redis client — aligned with rusty-sidekiq's redis dep
# tls-rustls-webpki-roots bundles Mozilla root CAs so TLS works without OS ca-certificates
# tokio-rustls-comp: async TLS integration; tls-rustls-webpki-roots: bundled root CAs (works in containers without OS ca-certificates)
# tls-rustls-insecure: without this, the documented `#insecure` URL fragment is NOT
# silently ignored — the code path that actually skips certificate verification is
# compiled out, so redis-rs hard-fails the connection at connect time with an explicit
# "Cannot create insecure client without tls-rustls-insecure feature" error (see --insecure).
redis = { version = "1", features = ["tokio-comp", "tokio-rustls-comp", "tls-rustls-webpki-roots", "tls-rustls-insecure"] }

# Direct rustls dependency purely to call CryptoProvider::install_default() at startup.
# redis's own `tls-rustls` feature pulls in rustls with default-features = false and only
# the "std" feature — no crypto backend (ring/aws-lc-rs) is enabled anywhere in the tree
# (verified via `cargo tree -i rustls`/`-e features`), and redis's public API does not
# re-export the rustls crate. Without a process-level CryptoProvider installed, any TLS
# connection attempt (verifying or --insecure) panics inside rustls at handshake setup:
# "Could not automatically determine the process-level CryptoProvider from Rustls crate
# features." The "ring" feature here matches the backend we install in main().
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Latency histogram
hdrhistogram = "7"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Random bytes for jid generation (Sidekiq jid = 24 hex chars = 12 random bytes)
rand = "0.9"
hex = "0.4"

# Error handling
anyhow = "1"

# Table formatting
comfy-table = "7"

# Time formatting
chrono = { version = "0.4", features = ["serde"] }

# URL parsing — safe password encoding and redaction
url = "2"

# Global allocator: ~4x throughput on alpine/musl, ~5–15% on glibc.
mimalloc = { version = "0.1", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
