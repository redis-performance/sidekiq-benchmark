services:
  redis:
    image: ${REDIS_IMAGE:-redis:8.6}
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --save "" --loglevel warning
    # Uncomment to require a password:
    # command: redis-server --save "" --loglevel warning --requirepass changeme

  bench:
    build: .
    profiles:
      - run
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    command: ["--workers", "10,50,100,200", "--jobs", "500000"]
    depends_on:
      - redis
